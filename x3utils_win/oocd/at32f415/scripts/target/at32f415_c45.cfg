# =============================================================================
# at32f415_c45.cfg
#
# AT32F415 target config with manual connect-under-reset for clone ST-Link.
#
# The clone cannot drive nRST. The operator holds nRST LOW for the entire
# operation and releases only after OpenOCD exits.
# =============================================================================

# --- Interface ---------------------------------------------------------------
source [find interface/stlink.cfg]
transport select hla_swd

# --- Target ------------------------------------------------------------------
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME at32f415xx
}
if { [info exists ENDIAN] } {
    set _ENDIAN $ENDIAN
} else {
    set _ENDIAN little
}
if { [info exists WORKAREASIZE] } {
    set _WORKAREASIZE $WORKAREASIZE
} else {
    set _WORKAREASIZE 0x1000
}
if { [info exists CPUTAPID] } {
    set _CPUTAPID $CPUTAPID
} else {
    if { [using_jtag] } {
        set _CPUTAPID 0x4ba00477
    } else {
        set _CPUTAPID 0x2ba01477
    }
}
if { [info exists FLASH_SIZE] } {
    set _FLASH_SIZE $FLASH_SIZE
} else {
    set _FLASH_SIZE 0
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap
$_TARGETNAME configure \
    -work-area-phys 0x20000000 \
    -work-area-size $_WORKAREASIZE \
    -work-area-backup 0

set _FLASHNAME $_CHIPNAME.bank1
flash bank $_FLASHNAME $_CHIPNAME 0x08000000 0 0 0 $_TARGETNAME

adapter speed 1000
adapter srst delay 100

# srst_nogate keeps the DAP clocked while nRST is held LOW.
# This allows flash reads without ever releasing reset.
reset_config srst_only srst_nogate connect_assert_srst

# --- Events ------------------------------------------------------------------
$_TARGETNAME configure -event examine-end {
    mmw 0xE0042004 0x00000307 0
    poll off
}

$_TARGETNAME configure -event trace-config {
    mmw 0xE0042004 0x00000020 0
}

$_TARGETNAME configure -event reset-init {
    mww 0x40021030 0x02100000
    mww 0x40021054 0x0000020D
    mww 0x40022000 0x00000011
    sleep 1
}

# =============================================================================
# guided_connect
#
# Two-step operator procedure.
# Step 1: Operator grounds nRST. Script connects and sets VC_CORERESET.
# Step 2: Operator releases nRST. CPU halts at reset vector.
# Firmware never runs. ST-Link must stay connected until exit.
# Usage:
#   openocd -s "%SCRIPTS_DIR%" -f target\at32f415_c45.cfg ^
#           -c "guided_connect {%CONNECT_TIMEOUT%}" ^
#           -c "dump_image {out.bin} 0x08000000 0x20000" ^
#           -c "exit"
# =============================================================================

proc guided_connect { {wait_seconds 0} } {
    set D "============================================================"

    echo ""
    echo ""
    echo $D
    echo "       Guided manual connect-under-reset for AT32F415"
    echo $D
    echo ""
    echo ""

    # ------------------------------------------------------------------
    # STEP 1 -- operator grounds nRST
    # ------------------------------------------------------------------
    echo "                 Step 1/2 - Ground nRST                      "
    echo $D
    echo "   *** Hold a wire between the chip nRST pin and GND ***    "
    echo $D
    echo "  Keep it grounded. Press any key when ready..."
    gets stdin
    echo "  Connecting in ${wait_seconds}s..."
    for { set i $wait_seconds } { $i > 0 } { incr i -1 } {
        echo "  $i ."
        after 1000
    }
    echo "  0"
    echo ""

    # ------------------------------------------------------------------
    # STEP 1.5 - init + set VC_CORERESET while nRST is LOW (silent)
    # ------------------------------------------------------------------
    at32f415xx.cpu configure -event examine-end {
        # suppressed -- chip in reset, debug regs not accessible
    }

    if { [catch { init } err] } {
        echo ""
        echo "  \[FAIL\]  Adapter init failed: $err"
        echo "  Check ST-Link connection and target power."
        return
    }
    poll off

    if { [catch { mww 0xE000EDFC 0x00000001 } err] } {
        echo ""
        echo "  \[FAIL\]  DEMCR write failed: $err"
        echo "  nRST may not be held LOW."
        poll on
        return
    }

    if { [catch { set demcr [mrw 0xE000EDFC] } err] } {
        echo ""
        echo "  \[WARN\]  DEMCR readback failed -- continuing anyway"
    } elseif { !($demcr & 0x1) } {
        echo ""
        echo "  \[WARN\]  VC_CORERESET NOT set -- CPU may run on release."
    }

    # ------------------------------------------------------------------
    # STEP 2 -- operator releases nRST
    # ------------------------------------------------------------------
    echo ""
    echo "                 Step 2/2 - Release nRST                     "
    echo $D
    echo "            *** Remove the wire from GND now ***            "
    echo $D
    echo "  CPU will halt - firmware will NOT run."
    echo "  Press any key when ready..."
    gets stdin
    echo ""

    at32f415xx.cpu configure -event examine-end {
        mmw 0xE0042004 0x00000307 0
    }

    set examined 0
    for { set i 0 } { $i < 5 } { incr i } {
        if { ![catch { at32f415xx.cpu arp_examine } err] } {
            set examined 1
            break
        }
        after 200
    }
    if { !$examined } {
        echo ""
        echo $D
        echo "  \[FAIL\]  Could not re-examine target."
        echo "  Check nRST was released and chip is powered."
        echo $D
        poll on
        return
    }

    catch { mww 0xE000EDFC 0x00000000 }
    poll on

    echo ""
    echo $D
    echo "        CPU halted.  Ready to dump.         "
    echo $D
    echo ""
}

# =============================================================================
# guided_flash_connect
#
# Two-step operator procedure.
# Step 1: Operator grounds nRST. Script connects and sets VC_CORERESET.
# Step 2: Operator releases nRST. CPU halts at reset vector.
# Firmware never runs. Flash operations proceed.
# ST-Link must stay connected until exit.
# Usage:
#   openocd -s "%SCRIPTS_DIR%" -f target\at32f415_c45.cfg ^
#           -c "guided_flash_connect {%CONNECT_TIMEOUT%}" ^
#           -c "flash erase_address 0x08000000 0x20000" ^
#           -c "flash write_bank 0 {in.bin}" ^
#           -c "verify_image {in.bin} 0x08000000" ^
#           -c "exit"
# =============================================================================

proc guided_flash_connect { {wait_seconds 0} } {
    set D "============================================================"
    
    echo ""
    echo ""
    echo $D
    echo "       Guided manual connect-under-reset for AT32F415"
    echo "           Flash mode - CPU halts at reset vector"
    echo $D
    echo ""
    echo ""

    # ------------------------------------------------------------------
    # STEP 1 -- operator grounds nRST
    # ------------------------------------------------------------------
    echo "                 Step 1/2 - Ground nRST                      "
    echo $D
    echo "   *** Hold a wire between the chip nRST pin and GND ***    "
    echo $D
    echo "  Keep it grounded. Press any key when ready..."
    gets stdin
    echo "  Connecting in ${wait_seconds}s..."
    for { set i $wait_seconds } { $i > 0 } { incr i -1 } {
        echo "  $i ."
        after 1000
    }
    echo "  0"
    echo ""

    # ------------------------------------------------------------------
    # STEP 1.5 - init + set VC_CORERESET while nRST is LOW (silent)
    # ------------------------------------------------------------------
    at32f415xx.cpu configure -event examine-end {
        # suppressed -- chip in reset, debug regs not accessible
    }

    if { [catch { init } err] } {
        echo ""
        echo "  \[FAIL\]  Adapter init failed: $err"
        echo "  Check ST-Link connection and target power."
        return
    }
    poll off

    if { [catch { mww 0xE000EDFC 0x00000001 } err] } {
        echo ""
        echo "  \[FAIL\]  DEMCR write failed: $err"
        echo "  nRST may not be held LOW."
        poll on
        return
    }

    if { [catch { set demcr [mrw 0xE000EDFC] } err] } {
        echo ""
