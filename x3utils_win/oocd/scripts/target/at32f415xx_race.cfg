# =============================================================================
# at32f415xx_race.cfg   (EXPERIMENTAL - power-race RESPAWN connect)
#
# Minimal plain-SWD connect to a RUNNING AT32F415, meant to be launched over and
# over (respawn race) while the operator power-cycles the board's 12V. Each fresh
# openocd launch is one full connect attempt; the launch that lands in the brief
# post-power-on window - before the firmware disables SWD - connects, and the
# caller halts the core.
#
# Why respawn and not an in-session loop: openocd's `init` (the DAP/SWD connect)
# is one-shot and needs the chip already alive; you can't re-run it or spam it.
# So the ONLY way to catch a power-on window is repeated fresh launches. (An
# in-session arp_examine hammer was tried and fails - once SWD drops it can't
# re-establish.)
#
# No reset line (the clone can't drive nRST and this corner case has none
# reachable). READ-ONLY connect - do NOT add unlock/erase/write here; use the
# vetted rdp raw-register FAP clear if you ever need to clear read protection.
#
# Loaded by dump.bat's RACE branch (connection mode D); the [find ...] sources
# resolve via -s <oocd\scripts>. Holds race_connect (bottom) = one respawn attempt.
# =============================================================================

# --- Interface (self-contained so a single -f target\at32f415xx_race.cfg loads) --
source [find interface/stlink.cfg]
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

set _CHIPNAME at32f415xx
set _ENDIAN little
set _WORKAREASIZE 0x1000
if { [using_jtag] } {
    set _CPUTAPID 0x4ba00477
} else {
    set _CPUTAPID 0x2ba01477
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

set _FLASHNAME $_CHIPNAME.bank1
flash bank $_FLASHNAME $_CHIPNAME 0x08000000 0 0 0 $_TARGETNAME

adapter speed 1000

# No reset line - plain SWD connect to the running core. No srst delay so each
# respawn attempt is as fast as possible.
reset_config srst_nogate

# Scripted use only - no debug servers (skips the gdb/tcl/telnet bind each launch,
# which otherwise shows up as "starting gdb server" noise on marginal catches).
gdb_port disabled
tcl_port disabled
telnet_port disabled

# poll off the INSTANT we attach: a MARGINAL catch (DAP up but the core still
# unstable at the power-on edge) otherwise sends OpenOCD into a reexamine/reconnect
# flail for seconds - that is the "hang". Killing polling here makes a shaky connect
# fail fast so the .bat just relaunches. The DBGMCU watchdog-freeze write is done in
# race_connect AFTER a good halt (not here), so it never runs on an unstable target.
$_TARGETNAME configure -event examine-end {
    poll off
}

# --- race_connect -------------------------------------------------------------
# ONE power-race attempt, called by dump.bat's respawn loop:
#   openocd ... -f at32f415xx_race.cfg -c "race_connect" -c "dump_image ..." -c exit
# init = the one-shot DAP/SWD connect (fails fast if this launch missed the
# window); halt freezes the core so SWD stays up for the read. READ-ONLY - no
# unlock/erase/write here. On a miss it exits non-zero so the .bat relaunches.
proc race_connect {} {
    if { [catch { init } err] } { shutdown error }
    catch { poll off }
    if { [catch { halt } err] } { shutdown error }
    # Solidly connected + halted now -> freeze the watchdog (DBGMCU_CR |= DBG_STOP/
    # STANDBY/SLEEP/WWDG_STOP/IWDG_STOP) so it can't reset the chip mid-dump. Safe
    # here: a marginal catch already bailed at the halt above, so this only ever
    # runs against a stable target.
    catch { mmw 0xE0042004 0x00000307 0 }
    return
}
