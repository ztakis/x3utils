# =============================================================================
# rescue.cfg  —  self-contained AT32F415 protection-rescue config
#
# Lives in special/rdp/ so the rescue tool is INDEPENDENT of the launcher mode
# in config.sh. It always uses the universal manual connect-under-reset (ground
# nRST/C45 by hand) — which works with BOTH clone and genuine ST-Links, because
# grounding the pin does not depend on the adapter having a working reset line.
#
# Provides two procs:
#   guided_rescue {wait}  — manual connect-under-reset, halts core before FW runs
#   do_rescue_unlock      — erase USD + program FAP=0xA5 (clears read+write prot)
#
# Typical use (see rescue_unlock.sh):
#   openocd -s "$SCRIPTS_DIR" -f special/rdp/rescue.cfg \
#           -c "guided_rescue {3}" -c "do_rescue_unlock" -c "shutdown"
#
# NOTE: uses raw flash-controller register writes (STM32F1-compatible AT32F415
# controller at 0x40022000, USD/option area at 0x1FFFF800). On a read-protected
# part, restoring FAP=0xA5 forces a hardware mass-erase of main flash on reload.
# =============================================================================

# --- Interface + helpers (resolved via openocd -s search path) ---------------
source [find interface/stlink.cfg]
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

# --- Target ------------------------------------------------------------------
if { [info exists CHIPNAME] } { set _CHIPNAME $CHIPNAME } else { set _CHIPNAME at32f415xx }
if { [info exists ENDIAN] } { set _ENDIAN $ENDIAN } else { set _ENDIAN little }
if { [info exists WORKAREASIZE] } { set _WORKAREASIZE $WORKAREASIZE } else { set _WORKAREASIZE 0x1000 }
if { [info exists CPUTAPID] } {
    set _CPUTAPID $CPUTAPID
} else {
    if { [using_jtag] } { set _CPUTAPID 0x4ba00477 } else { set _CPUTAPID 0x2ba01477 }
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

set _FLASHNAME $_CHIPNAME.bank1
flash bank $_FLASHNAME $_CHIPNAME 0x08000000 0 0 0 $_TARGETNAME

# Rescue runs a conservative SWD clock on purpose: Artery's stock configs use
# 5000 and these tools ran 1000, but clone ST-Links glitch during manual
# connect-under-reset at high speed. Reliability > speed here; drop to 240 if a
# board still throws "invalid mode value - communication failure".
adapter speed 480
adapter srst delay 100
# srst_nogate keeps the DAP clocked while nRST is held LOW.
reset_config srst_only srst_nogate connect_assert_srst

$_TARGETNAME configure -event examine-end {
    mmw 0xE0042004 0x00000307 0
    poll off
}

# --- ANSI colors (self-contained; procs reference these as TCL globals) ------
set CL_NC "\033\[0m"
set CL_R  "\033\[1;31m"
set CL_G  "\033\[1;32m"
set CL_Y  "\033\[1;33m"
set CL_C  "\033\[1;36m"
set D "============================================================"

# =============================================================================
# guided_rescue {wait_seconds}
#
# Manual connect-under-reset. Step 1: operator grounds nRST; OpenOCD connects
# and arms VC_CORERESET. Step 2: operator releases nRST; CPU halts at the reset
# vector so firmware NEVER runs. Works with clone or genuine ST-Links.
# =============================================================================
proc guided_rescue { {wait_seconds 0} } {
    global CL_NC CL_R CL_G CL_Y CL_C D

    echo ""
    echo $D
    echo "        Guided connect-under-reset for AT32F415 rescue"
    echo $D
    echo ""

    # --- Step 1: operator grounds nRST ---------------------------------------
    echo "                 Step 1/2 - Ground nRST"
    echo $D
    echo "   ${CL_C}*** Hold a wire between the chip nRST pin and GND ***${CL_NC}"
    echo $D
    echo "  Keep it grounded. Press any key when ready..."
    gets stdin
    echo "  Connecting in ${wait_seconds}s..."
    for { set i $wait_seconds } { $i > 0 } { incr i -1 } {
        echo "  $i ."
        sleep 1000
    }
    echo "  0"
    echo ""

    # init + set VC_CORERESET while nRST is LOW
    at32f415xx.cpu configure -event examine-end {
        # suppressed -- chip in reset, debug regs not accessible
    }
    if { [catch { init } err] } {
        echo ""
        echo "  \[${CL_R}FAIL${CL_NC}\]  Adapter init failed: $err"
        echo "  Check ST-Link connection and target power."
        shutdown error
    }
    poll off
    if { [catch { mww 0xE000EDFC 0x00000001 } err] } {
        echo ""
        echo "  \[${CL_R}FAIL${CL_NC}\]  DEMCR write failed: $err"
        echo "  nRST may not be held LOW."
        poll on
        shutdown error
    }
    if { [catch { set demcr [mrw 0xE000EDFC] } err] } {
        echo "  \[${CL_Y}WARN${CL_NC}\]  DEMCR readback failed -- continuing anyway"
    } elseif { !($demcr & 0x1) } {
        echo "  \[${CL_Y}WARN${CL_NC}\]  VC_CORERESET NOT set -- CPU may run on release."
    }

    # --- Step 2: operator releases nRST --------------------------------------
    echo ""
    echo "                 Step 2/2 - Release nRST"
    echo $D
    echo "            ${CL_Y}*** Remove the wire from GND now ***${CL_NC}"
    echo $D
    echo "  Press any key when ready..."
    gets stdin
    echo ""

    at32f415xx.cpu configure -event examine-end {
        mmw 0xE0042004 0x00000307 0
    }
    # Re-examine with retries. A clone ST-Link can throw a transient
    # "invalid mode value - communication failure" right after nRST release.
    set examined 0
    for { set i 0 } { $i < 8 } { incr i } {
        if { ![catch { at32f415xx.cpu arp_examine } err] } { set examined 1; break }
        sleep 300
    }
    if { !$examined } {
        echo ""
        echo "  \[${CL_R}FAIL${CL_NC}\]  Could not re-examine target after nRST release."
        echo "  Retry: hold nRST steady, release cleanly on the prompt."
        poll on
        shutdown error
    }
    catch { mww 0xE000EDFC 0x00000000 }
    # Halt with retries, keeping background polling OFF so a transient glitch
    # does not spam "Polling target failed"; enable polling only once halted.
    set halted 0
    for { set i 0 } { $i < 5 } { incr i } {
        if { ![catch { halt } err] } { set halted 1; break }
        sleep 200
    }
    poll on
    if { !$halted } {
        echo ""
        echo "  \[${CL_R}FAIL${CL_NC}\]  Could not halt target after re-examine: $err"
        echo "  Usually a clone-ST-Link comms glitch — just retry."
        shutdown error
    }

    echo ""
    echo $D
    echo "                 ${CL_G}Connected. Ready to rescue.${CL_NC}"
    echo $D
    echo ""
}

# NOTE: the FAP=0xA5 option-rewrite is NOT defined here. It lives in rdp_lib.sh
# as the UNLOCK_REWRITE command list, so it can run after ANY connect method
# (this file's guided_rescue, or a launcher mode via -l). rescue.cfg only
# provides the connect-under-reset primitive above.
