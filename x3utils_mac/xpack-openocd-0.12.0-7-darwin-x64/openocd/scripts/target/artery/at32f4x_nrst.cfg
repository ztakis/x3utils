#
# Configuration file for Artery AT32F4x family.
# nRST variant: adds connect-under-reset support for genuine ST-Link probes
# that can drive SRST natively (as opposed to clone probes, which cannot).
#
# https://www.arterychip.com/en/product/
#
# NOTE: explicitly select "swd" transport (not "hla_swd" -- this adapter
# runs in direct DAP mode, not legacy HLA mode) so OpenOCD doesn't fall
# back to auto-selecting a transport, which was pulling in default
# reset_config flags (separate, srst_open_drain) that conflicted with
# this file's own reset_config line.

# transport select swd

# AT32F4x devices support JTAG and SWD transport.
source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME at32f4x
}

# Work-area is a space in RAM used for flash programming, by default use 4 KiB.
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x1000
}

if { [info exists CPUTAPID] } {
   set _CPUTAPID $CPUTAPID
} else {
   if { [using_jtag] } {
      set _CPUTAPID 0x4ba00477
   } {
      set _CPUTAPID 0x1ba01477
   }
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian little -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME artery 0x08000000 0 0 0 $_TARGETNAME

adapter speed 1000

# nRST variant: genuine ST-Link drives SRST itself, so assert it at connect
# time instead of the generic file's software SYSRESETREQ-based reset.
reset_config srst_only srst_nogate connect_assert_srst
