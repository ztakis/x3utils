# =============================================================================
# at32f4x_race.cfg   (EXPERIMENTAL - power-race RESPAWN connect)
#
# Minimal plain-SWD connect to a RUNNING AT32F415, meant to be launched over and
# over while the operator power-cycles the board. Each fresh OpenOCD launch is
# one full connect attempt; the launch that lands before firmware disables SWD
# connects and lets the caller halt the core.
#
# macOS uses stock upstream OpenOCD, where the AT32 flash driver is registered
# as "artery". Keep the at32f415xx chip/target name for the known target IDs,
# but use "artery" as the flash-bank driver.
# =============================================================================

source [find interface/stlink.cfg]
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

set _CHIPNAME at32f415xx
set _ENDIAN little
set _WORKAREASIZE 0x1000
if { [using_jtag] } {
    set _CPUTAPID 0x4ba00477
} else {
    set _CPUTAPID 0x2ba01477
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

set _FLASHNAME $_CHIPNAME.bank1
flash bank $_FLASHNAME artery 0x08000000 0 0 0 $_TARGETNAME

adapter speed 1000
reset_config srst_nogate

gdb_port disabled
tcl_port disabled
telnet_port disabled

$_TARGETNAME configure -event examine-end {
    poll off
}

proc race_connect {} {
    if { [catch { init } err] } { shutdown error }
    catch { poll off }
    if { [catch { halt } err] } { shutdown error }
    catch { mmw 0xE0042004 0x00000307 0 }
    return
}
