# =============================================================================
# at32f415_alt.cfg
#
# AT32F415 target config with manual connect-under-reset for clone ST-Link.
#
# The clone cannot drive nRST. The operator holds nRST LOW for the entire
# operation and releases only after OpenOCD exits.
#
# Usage:
#   openocd -s "%SCRIPTS_DIR%" -f target\at32f415_alt.cfg ^
#           -c "guided_connect" ^
#           -c "dump_image {out.bin} 0x08000000 0x20000" ^
#           -c "exit"
# =============================================================================

# --- Interface ---------------------------------------------------------------
source [find interface/stlink.cfg]
transport select hla_swd

# --- Target ------------------------------------------------------------------
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME at32f415xx
}
if { [info exists ENDIAN] } {
    set _ENDIAN $ENDIAN
} else {
    set _ENDIAN little
}
if { [info exists WORKAREASIZE] } {
    set _WORKAREASIZE $WORKAREASIZE
} else {
    set _WORKAREASIZE 0x1000
}
if { [info exists CPUTAPID] } {
    set _CPUTAPID $CPUTAPID
} else {
    if { [using_jtag] } {
        set _CPUTAPID 0x4ba00477
    } else {
        set _CPUTAPID 0x2ba01477
    }
}
if { [info exists FLASH_SIZE] } {
    set _FLASH_SIZE $FLASH_SIZE
} else {
    set _FLASH_SIZE 0
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap
$_TARGETNAME configure \
    -work-area-phys 0x20000000 \
    -work-area-size $_WORKAREASIZE \
    -work-area-backup 0

set _FLASHNAME $_CHIPNAME.bank1
flash bank $_FLASHNAME $_CHIPNAME 0x08000000 0 0 0 $_TARGETNAME

adapter speed 1000
adapter srst delay 100

# srst_nogate keeps the DAP clocked while nRST is held LOW.
# This allows flash reads without ever releasing reset.
reset_config srst_only srst_nogate connect_assert_srst

# --- Events ------------------------------------------------------------------
$_TARGETNAME configure -event examine-end {
    mmw 0xE0042004 0x00000307 0
    poll off
}

$_TARGETNAME configure -event trace-config {
    mmw 0xE0042004 0x00000020 0
}

$_TARGETNAME configure -event reset-init {
    mww 0x40021030 0x02100000
    mww 0x40021054 0x0000020D
    mww 0x40022000 0x00000011
    sleep 1
}

# =============================================================================
# guided_connect
#
# Operator holds nRST LOW for the ENTIRE operation.
# Flash is read via DAP while chip is frozen -- firmware never runs.
# Release nRST only after OpenOCD exits.
# =============================================================================
proc guided_connect { {wait_seconds 0} } {
    set D  "============================================================"
    set NC "\033\[0m"
    set R  "\033\[1;31m"
    set G  "\033\[1;32m"
    set Y  "\033\[1;33m"
    set M  "\033\[1;35m"
    set C  "\033\[1;36m"

    echo ""
    echo $D
    echo "  MANUAL CONNECT-UNDER-RESET  --  AT32F415 / clone ST-Link"
    echo $D

    # ------------------------------------------------------------------
    # STEP 1 -- operator grounds nRST
    # ------------------------------------------------------------------
    echo ""
    echo "  STEP 1 / 3  --  GROUND nRST"
    echo "  ----------------------------"
    echo "${C}  >>> Hold a wire between the chip nRST pin and GND <<<${NC}"
    echo ""
    echo "  Keep it grounded.  Connecting in ${wait_seconds}s..."
    echo ""
    after [expr {$wait_seconds * 1000}]

    # ------------------------------------------------------------------
    # STEP 2 -- init + set VC_CORERESET while nRST is LOW
    # ------------------------------------------------------------------
    echo $D
    echo "  STEP 2 / 3  --  CONNECTING  (nRST still LOW)"
    echo $D
    echo ""

    at32f415xx.cpu configure -event examine-end {
        echo "  \[examine-end\]  Suppressed (chip in reset)."
    }

    init
    poll off
    echo "${G}  Adapter connected.  Polling disabled.${NC}"
    echo ""

    echo "  Setting DEMCR.VC_CORERESET (nRST still LOW)..."
    if { [catch { mww 0xE000EDFC 0x00000001 } err] } {
        echo "  \[FAIL\]  DEMCR write failed: $err"
        poll on
        return
    }
    if { [catch { set demcr [mrw 0xE000EDFC] } err] } {
        echo "  \[WARN\]  DEMCR readback failed: $err -- continuing anyway"
    } else {
        if { ($demcr & 0x1) } {
            echo "${G}  VC_CORERESET confirmed SET.${NC}"
        } else {
            echo "  \[WARN\]  VC_CORERESET NOT set -- CPU may run on release."
        }
    }

    # ------------------------------------------------------------------
    # STEP 3 -- operator releases nRST
    # ------------------------------------------------------------------
    echo ""
    echo $D
    echo "  STEP 3 / 3  --  RELEASE nRST"
    echo $D
    echo ""
    echo "${Y}  >>> Remove the wire from GND now <<<${NC}"
    echo "  CPU will halt at reset vector -- firmware will NOT run."
    echo ""
    echo "  Waiting ${wait_seconds}s..."
    after [expr {$wait_seconds * 1000}]

    at32f415xx.cpu configure -event examine-end {
        mmw 0xE0042004 0x00000307 0
    }

    echo "  Re-examining target..."
    set examined 0
    for { set i 0 } { $i < 5 } { incr i } {
        if { ![catch { at32f415xx.cpu arp_examine } err] } {
            echo "  Re-examine OK on attempt [expr {$i + 1}]."
            set examined 1
            break
        }
        echo "  Re-examine attempt [expr {$i + 1}] failed: $err"
        after 200
    }
    if { !$examined } {
        echo "  \[FAIL\]  Could not re-examine target."
        echo "  Check nRST was released and chip is powered."
        poll on
        return
    }

    catch { mww 0xE000EDFC 0x00000000 }
    poll on

    echo ""
    echo $D
    echo "${G}  CPU halted at reset vector.  Ready to dump.${NC}"
    echo $D
    echo ""
}

# =============================================================================
# guided_flash_connect
#
# Like guided_connect but halts the CPU at the reset vector so the flash
# loader can execute.  Uses DEMCR.VC_CORERESET (writable via DAP while
# nRST is LOW) to trap the CPU before any firmware runs.
#
# Sequence:
#   STEP 1  Operator grounds nRST.  Script waits, then calls init.
#   STEP 2  VC_CORERESET set while chip is frozen -- CPU will halt at
#           the reset vector the instant nRST is released.
#   STEP 3  Operator releases nRST.  Script re-examines and clears
#           VC_CORERESET.  CPU stays halted.  Flash ops proceed.
#
# flash.bat call:
#   -c "guided_flash_connect" ^
#   -c "flash erase_address 0x08000000 0x20000" ^
#   -c "flash write_bank 0 {path}" ^
#   -c "verify_image {path} 0x08000000" ^
#   -c "exit"
# =============================================================================
proc guided_flash_connect { {wait_seconds 0} } {
    set D  "============================================================"
	set NC "\033\[0m"
	set R  "\033\[1;31m"
	set G  "\033\[1;32m"
    set Y  "\033\[1;33m"
	set M  "\033\[1;35m"
	set C  "\033\[1;36m"

    echo ""
    echo $D
    echo "  MANUAL CONNECT-UNDER-RESET  --  AT32F415 / clone ST-Link"
    echo "  Flash mode -- CPU will halt at reset vector"
    echo $D

    # ------------------------------------------------------------------
    # STEP 1 -- operator grounds nRST
    # ------------------------------------------------------------------
    echo ""
    echo "  STEP 1 / 3  --  GROUND nRST"
    echo "  ----------------------------"
    echo "${C}  >>> Hold a wire between the chip nRST pin and GND <<<${NC}"
    echo ""
    echo "  Keep it grounded.  Connecting in ${wait_seconds}s..."
    echo ""
    after [expr {$wait_seconds * 1000}]

    # ------------------------------------------------------------------
    # STEP 2 -- init + set VC_CORERESET while nRST is LOW
    # ------------------------------------------------------------------
    echo $D
    echo "  STEP 2 / 3  --  CONNECTING  (nRST still LOW)"
    echo $D
    echo ""

    # Suppress examine-end: chip frozen, debug regs not accessible
    at32f415xx.cpu configure -event examine-end {
        echo "  \[examine-end\]  Suppressed (chip in reset)."
    }

    init
    poll off
    echo "${G}  Adapter connected.  Polling disabled.${NC}"
    echo ""

    echo "  Setting DEMCR.VC_CORERESET (nRST still LOW)..."
    if { [catch { mww 0xE000EDFC 0x00000001 } err] } {
        echo "${R}  \[FAIL\]  DEMCR write failed: $err${NC}"
        poll on
        return
    }
    if { [catch { set demcr [mrw 0xE000EDFC] } err] } {
        echo "  \[WARN\]  DEMCR readback failed: $err -- continuing anyway"
    } else {
        echo "  DEMCR = [format 0x%08x $demcr]"
        if { ($demcr & 0x1) } {
            echo "${G}  VC_CORERESET confirmed SET.${NC}"
        } else {
            echo "${R}  \[WARN\]  VC_CORERESET NOT set -- CPU may run on release.${NC}"
        }
    }

    # ------------------------------------------------------------------
    # STEP 3 -- operator releases nRST
    # ------------------------------------------------------------------
    echo ""
    echo $D
    echo "  STEP 3 / 3  --  RELEASE nRST"
    echo $D
    echo ""
    echo "${Y}  >>> Remove the wire from GND now <<<${NC}"
    echo "  CPU will halt at reset vector -- firmware will NOT run."
    echo ""
    echo "  Waiting ${wait_seconds}s..."
    after [expr {$wait_seconds * 1000}]

    at32f415xx.cpu configure -event examine-end {
        mmw 0xE0042004 0x00000307 0
    }

    echo "  Re-examining target..."
    set examined 0
    for { set i 0 } { $i < 5 } { incr i } {
        if { ![catch { at32f415xx.cpu arp_examine } err] } {
            echo "  Re-examine OK on attempt [expr {$i + 1}]."
            set examined 1
            break
        }
        echo "  Re-examine attempt [expr {$i + 1}] failed: $err"
        after 200
    }
    if { !$examined } {
        echo "${R}  \[FAIL\]  Could not re-examine target.${NC}"
        echo "  Check nRST was released and chip is powered."
        poll on
        return
    }

    catch { mww 0xE000EDFC 0x00000000 }
    poll on

    echo ""
    echo $D
    echo "${G}  CPU halted at reset vector.  Ready to flash.${NC}"
    echo $D
    echo ""
}
